<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0b0d"/>
<title>Games</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0b0d;--panel:#15171c;--line:#262a33;--text:#f2f3f5;--muted:#9aa1ac}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100dvh;padding:env(safe-area-inset-top) 16px 24px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px;max-width:520px;margin:0 auto}
  .back{color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;padding:8px}
  h1{font-size:26px;margin:8px auto 4px;max-width:520px;font-weight:700}
  p.sub{color:var(--muted);max-width:520px;margin:0 auto 18px;font-size:15px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px;margin:0 auto}
  a.tile{display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:1;border-radius:22px;padding:16px;text-decoration:none;color:#0a0b0d;font-weight:700;position:relative;overflow:hidden}
  a.tile .emo{font-size:52px;position:absolute;top:14px;left:16px}
  a.tile .name{font-size:20px}
  a.tile .desc{font-size:12.5px;font-weight:600;opacity:.75;margin-top:2px}
  .t1{background:linear-gradient(145deg,#ffd24e,#ffb14e)}
  .t2{background:linear-gradient(145deg,#7fe0ff,#4ec7ff)}
  .t3{background:linear-gradient(145deg,#c9a9ff,#a679ff)}
  .full{grid-column:1/-1;aspect-ratio:auto;min-height:96px;flex-direction:row;align-items:center;gap:14px}
  .full .emo{position:static;font-size:44px}
</style>
</head>
<body>
  <div class="top"><a class="back" href="/#k/games">‹ Back</a><span style="font-weight:700;color:var(--muted)">🎮 Games</span><span style="width:52px"></span></div>
  <h1>Games</h1>
  <p class="sub">All playable offline. Have fun!</p>
  <div class="grid">
    <a class="tile t1" href="/kids-games/boggle.html"><span class="emo">🔤</span><span class="name">Boggle</span><span class="desc">Find words in the grid before time runs out</span></a>
    <a class="tile t2" href="/kids-games/wordsearch.html"><span class="emo">🔎</span><span class="name">Word Search</span><span class="desc">Hunt the hidden words</span></a>
    <a class="tile t3 full" href="/kids-games/wordconnect.html"><span class="emo">🧩</span><span><span class="name">Word Connect</span><div class="desc">Swipe letters to make words & fill the puzzle</div></span></a>
  </div>
</body>
</html>
