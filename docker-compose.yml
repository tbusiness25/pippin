# Pippin — app + its own Postgres (+ optional WhatsApp link). Copy .env.example to .env first.
services:
  db:
    image: postgres:16-alpine
    container_name: ${CONTAINER_PREFIX:-pippin}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pippin}
      POSTGRES_USER: ${DB_USER:-pippin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5446}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pippin} -d ${DB_NAME:-pippin}"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        SW_VERSION: ${SW_VERSION:-dev}
    image: pippin:latest
    container_name: ${CONTAINER_PREFIX:-pippin}-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_HOST_PORT:-8910}:8080"   # put HTTPS (a reverse proxy) in front
    user: "${APP_UID:-1000}:${APP_GID:-1000}"   # files written to your vault stay yours
    volumes:
      - ./public:/app/public   # frontend served live; bump SW_VERSION after edits
      # Optional Obsidian folder: the app writes ONLY here, and only what you approve.
      - ${VAULT_HOST_DIR:-./vault}:/vault
      # Optional voice-note folder — READ-ONLY. Important audio is copied into ./data.
      - ${VOICE_NOTES_HOST_DIR:-./voice-notes}:/voice-notes:${VOICE_NOTES_MOUNT:-ro}
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - extra

  # Optional live WhatsApp link — contact metadata only. Off unless COMPOSE_PROFILES=whatsapp.
  # Uses an unofficial library: see docs/KNOWN_ISSUES.md (B8). The export importer is the safer route.
  whatsapp:
    profiles: [whatsapp]
    build: ./whatsapp
    image: pippin-whatsapp:latest
    container_name: ${CONTAINER_PREFIX:-pippin}-whatsapp
    restart: unless-stopped
    environment:
      WHATSAPP_SIDECAR_SECRET: ${WHATSAPP_SIDECAR_SECRET}
      APP_INTERNAL_URL: http://app:8080/internal
      APP_NAME: ${APP_NAME:-}
    volumes:
      - wadata:/data
    # no published ports: only the app can reach its control API

  # ---- Optional fitness backend (COMPOSE_PROFILES=fitness): food diary, meal plans, workouts, Garmin sync.
  # SparkyFitness (github.com/CodeWithCJ/SparkyFitness) runs headless; Pippin has its own screens for it.
  # Only the app can reach it — no published ports.
  sparky-db:
    profiles: [fitness]
    image: postgres:18.3-alpine
    container_name: ${CONTAINER_PREFIX:-pippin}-sparky-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sparkyfitness_db
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: ${SPARKY_DB_PASSWORD}
    volumes:
      - ${SPARKY_DATA_DIR:-./data/sparky}/postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky -d sparkyfitness_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sparky-server:
    profiles: [fitness]
    image: codewithcj/sparkyfitness_server:${SPARKY_VERSION:-latest}
    container_name: ${CONTAINER_PREFIX:-pippin}-sparky-server
    restart: unless-stopped
    environment:
      SPARKY_FITNESS_DB_HOST: sparky-db
      SPARKY_FITNESS_DB_PORT: "5432"
      SPARKY_FITNESS_DB_NAME: sparkyfitness_db
      SPARKY_FITNESS_DB_USER: sparky
      SPARKY_FITNESS_DB_PASSWORD: ${SPARKY_DB_PASSWORD}
      SPARKY_FITNESS_APP_DB_USER: sparky_app
      SPARKY_FITNESS_APP_DB_PASSWORD: ${SPARKY_APP_DB_PASSWORD}
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${SPARKY_ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${SPARKY_AUTH_SECRET}
      SPARKY_FITNESS_FRONTEND_URL: http://app:8080
      SPARKY_FITNESS_SERVER_PORT: "3010"
      SPARKY_FITNESS_LOG_LEVEL: WARN
      GARMIN_MICROSERVICE_URL: http://sparky-garmin:8000
      NODE_ENV: production
      TZ: ${TZ_DEFAULT:-Europe/London}
    volumes:
      - ${SPARKY_DATA_DIR:-./data/sparky}/backup:/app/SparkyFitnessServer/backup
      - ${SPARKY_DATA_DIR:-./data/sparky}/uploads:/app/SparkyFitnessServer/uploads
    depends_on:
      sparky-db:
        condition: service_healthy

  sparky-garmin:
    profiles: [fitness]
    image: codewithcj/sparkyfitness_garmin:${SPARKY_VERSION:-latest}
    container_name: ${CONTAINER_PREFIX:-pippin}-sparky-garmin
    restart: unless-stopped
    environment:
      GARMIN_SERVICE_PORT: "8000"
      GARMIN_SERVICE_IS_CN: "false"

volumes:
  pgdata:
    name: ${PGDATA_VOLUME:-pippin-pgdata}
  wadata:
    name: ${WADATA_VOLUME:-pippin-wa-data}

networks:
  # Optional: join an existing Docker network (e.g. your reverse proxy's). Leave unset for a private one.
  extra:
    name: ${EXTRA_NETWORK:-pippin-extra}
    external: ${EXTRA_NETWORK_EXTERNAL:-false}
