name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Please don't paste real chats, journal entries or health data.** Make up an example instead."
  - type: textarea
    id: what
    attributes: { label: What happened?, description: And what did you expect? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
  - type: input
    id: version
    attributes: { label: Version, description: "Settings → bottom of the page, or `/api/health`" }
  - type: dropdown
    id: device
    attributes: { label: Device, options: [Android, iPhone/iPad, Desktop browser, Other] }
  - type: input
    id: model
    attributes: { label: Model (if it's about the coach or chat), placeholder: "e.g. qwen3.5:9b on Ollama" }
  - type: textarea
    id: logs
    attributes: { label: Logs, description: "`docker compose logs app --tail 100` — check for personal data first", render: text }
